name: CI

on:
  push:
    branches: [main, ameliorations-premium]
  pull_request:
    branches: [main, ameliorations-premium]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore Signature3D.sln
      - run: dotnet build Signature3D.sln --no-restore --configuration Release
      - run: dotnet test Signature3D.sln --no-build --configuration Release --filter "Category!=Integration"

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
